name: INDOT Upcoming Discovery

on:
  workflow_dispatch:

jobs:
  discover-indot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install discovery dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install pypdf

      - name: Run bounded INDOT discovery
        working-directory: indot
        shell: bash
        run: |
          set -euxo pipefail

          echo "Starting bounded INDOT letting discovery..."
          echo

          python - <<'PY'
          import json
          from live_connector import discover_upcoming_lettings

          results, index_entry = discover_upcoming_lettings()

          print()
          print("=" * 80)
          print("INDOT UPCOMING DISCOVERY")
          print("=" * 80)

          print(f"Archive retrieval timestamp: {index_entry.get('retrieval_timestamp')}")
          print(f"Archive checksum: {index_entry.get('checksum')}")
          print(f"Upcoming results returned: {len(results)}")

          print()
          print("RESULTS")
          print("=" * 80)

          for i, result in enumerate(results, start=1):
              print(f"\n--- Letting {i} ---")
              print(f"Letting date: {result.get('letting_date')}")
              print(f"Letting page: {result.get('letting_page_url')}")
              print(
                  f"Planholder available: "
                  f"{result.get('planholder_list_available')}"
              )

              if result.get("planholder_url"):
                  print(f"Planholder URL: {result.get('planholder_url')}")

              if result.get("reason"):
                  print(f"Reason: {result.get('reason')}")

          with open("discovery_results.json", "w", encoding="utf-8") as f:
              json.dump(
                  {
                      "archive": index_entry,
                      "results": results,
                  },
                  f,
                  indent=2,
                  sort_keys=True,
              )

          print()
          print("=" * 80)
          print("Saved discovery_results.json")
          print("=" * 80)
          PY

      - name: Upload discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: indot-upcoming-discovery
          path: |
            indot/discovery_results.json
            indot/live_cache/cache_index.json
          if-no-files-found: warn
