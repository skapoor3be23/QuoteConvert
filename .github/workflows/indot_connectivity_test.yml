name: INDOT Connectivity Test

on:
  workflow_dispatch:

jobs:
  test-indot:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch official INDOT letting page
        shell: bash
        run: |
          set -euxo pipefail

          PAGE_URL="https://www.in.gov/indot/doing-business-with-indot/home/contracts/wednesday%2C-july-8%2C-2026-regular-letting/"

          echo "Fetching:"
          echo "$PAGE_URL"

          curl -L --fail --silent --show-error \
            --connect-timeout 20 \
            --max-time 60 \
            -o july_8_2026.html \
            "$PAGE_URL"

          echo
          echo "Letting page downloaded:"
          wc -c july_8_2026.html

          echo
          echo "Page title:"
          grep -oi '<title[^>]*>[^<]*</title>' july_8_2026.html | head -n 1 || true

      - name: Find Bidders List link
        shell: bash
        run: |
          set -euxo pipefail

          echo "Searching page for Bidders List links..."

          grep -oiE 'href="[^"]+"[^>]*>[^<]*Bidders List[^<]*' \
            july_8_2026.html || true

          echo
          echo "All PDF links containing bidder/list:"
          grep -oiE 'href="[^"]+\.pdf[^"]*"' july_8_2026.html |
            grep -Ei 'bid|list' || true

      - name: Download real INDOT Planholder List
        shell: bash
        run: |
          set -euxo pipefail

          PDF_URL="https://www.in.gov/indot/doing-business-with-indot/files/Bidders-List_7.1.pdf"

          echo "Downloading:"
          echo "$PDF_URL"

          curl -L --fail --silent --show-error \
            --connect-timeout 20 \
            --max-time 120 \
            -o bidders_list_07_08_2026.pdf \
            "$PDF_URL"

          echo
          echo "PDF size:"
          wc -c bidders_list_07_08_2026.pdf

          echo
          echo "PDF header:"
          head -c 5 bidders_list_07_08_2026.pdf
          echo

          if [ "$(head -c 5 bidders_list_07_08_2026.pdf)" != "%PDF-" ]; then
            echo "ERROR: downloaded file is not a PDF"
            exit 1
          fi

      - name: Extract PDF text
        shell: bash
        run: |
          set -euxo pipefail

          echo "Installing PDF text extraction utility..."
          sudo apt-get update
          sudo apt-get install -y poppler-utils

          echo
          echo "Extracting PDF text..."

          pdftotext -layout \
            bidders_list_07_08_2026.pdf \
            bidders_list_07_08_2026.txt

          echo
          echo "Extracted text lines:"
          wc -l bidders_list_07_08_2026.txt

          echo
          echo "First 80 lines:"
          sed -n '1,80p' bidders_list_07_08_2026.txt

      - name: Verify real candidate-field data
        shell: bash
        run: |
          set -euxo pipefail

          echo "Contracts detected from PDF:"
          grep -Eo '[A-Z]{1,3}[[:space:]]*-[[:space:]]*[0-9]{4,6}[[:space:]]*-[[:space:]]*[A-Z0-9]+' \
            bidders_list_07_08_2026.txt |
            sed 's/[[:space:]]//g' |
            sort -u || true

          echo
          echo "Checking example live contract: R-43365-A"

          awk '
            /Contract[[:space:]]+R[[:space:]]*-43365-A/ {capture=1}
            capture && /Contract[[:space:]]+/ && !/R[[:space:]]*-43365-A/ {exit}
            capture {print}
          ' bidders_list_07_08_2026.txt |
            sed -n '1,120p'

          echo
          echo "Candidate rows containing Valid For Bid = Yes:"
          awk '
            /Contract[[:space:]]+R[[:space:]]*-43365-A/ {capture=1}
            capture && /Contract[[:space:]]+/ && !/R[[:space:]]*-43365-A/ {exit}
            capture && /Yes[[:space:]]*$/ {print}
          ' bidders_list_07_08_2026.txt || true

          echo
          echo "Total Valid For Bid occurrences in full document:"
          grep -i -c "Valid For Bid" bidders_list_07_08_2026.txt || true

          echo
          echo "Total Proposal Planholder List pages:"
          grep -i -c "PROPOSAL PLANHOLDER LIST" bidders_list_07_08_2026.txt || true

      - name: Save provenance
        shell: bash
        run: |
          set -euxo pipefail

          echo "Retrieved:"
          date -u +"%Y-%m-%dT%H:%M:%SZ"

          echo
          echo "SHA-256:"
          sha256sum bidders_list_07_08_2026.pdf

          echo
          echo "Downloaded files:"
          ls -lh \
            july_8_2026.html \
            bidders_list_07_08_2026.pdf \
            bidders_list_07_08_2026.txt

      - name: Upload live-data evidence
        uses: actions/upload-artifact@v4
        with:
          name: indot-live-planholder-test
          path: |
            july_8_2026.html
            bidders_list_07_08_2026.pdf
            bidders_list_07_08_2026.txt