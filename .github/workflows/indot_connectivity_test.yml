name: INDOT Connectivity Test

on:
  workflow_dispatch:

jobs:
  test-indot:
    runs-on: ubuntu-latest

    steps:
      - name: Test official INDOT letting page
        shell: bash
        run: |
          set -euxo pipefail

          URL="https://www.in.gov/indot/doing-business-with-indot/home/contracts/wednesday%2C-september-2%2C-2026-regular-letting/"

          echo "Testing: $URL"

          curl -L --fail --silent --show-error \
            --connect-timeout 20 \
            --max-time 60 \
            -o sept_2_2026.html \
            "$URL"

          echo "Page downloaded:"
          wc -c sept_2_2026.html

          echo "Page title:"
          grep -oi '<title[^>]*>[^<]*</title>' sept_2_2026.html | head -n 1 || true

      - name: Download official INDOT Planholder PDF
        shell: bash
        run: |
          set -euxo pipefail

          URL="https://www.in.gov/indot/doing-business-with-indot/files/BidderList_07.08.pdf"

          echo "Testing: $URL"

          curl -L --fail --silent --show-error \
            --connect-timeout 20 \
            --max-time 60 \
            -o bidder_list_07_08_2026.pdf \
            "$URL"

          echo "PDF size:"
          wc -c bidder_list_07_08_2026.pdf

          echo "PDF header:"
          head -c 5 bidder_list_07_08_2026.pdf
          echo

          if [ "$(head -c 5 bidder_list_07_08_2026.pdf)" != "%PDF-" ]; then
            echo "ERROR: downloaded file is not a PDF"
            exit 1
          fi

      - name: Calculate provenance
        shell: bash
        run: |
          set -euxo pipefail

          echo "Retrieval timestamp:"
          date -u +"%Y-%m-%dT%H:%M:%SZ"

          echo
          echo "SHA-256:"
          sha256sum bidder_list_07_08_2026.pdf

          echo
          echo "Files:"
          ls -lh sept_2_2026.html bidder_list_07_08_2026.pdf

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: indot-connectivity-results
          path: |
            sept_2_2026.html
            bidder_list_07_08_2026.pdf
